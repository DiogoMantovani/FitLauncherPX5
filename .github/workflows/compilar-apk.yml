name: Compilar Fit Launcher PX5 (APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/compilar-apk.yml'

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar API 34 e ferramentas de compilacao
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Testar interpretador OBD2 (JUnit)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compilar APK de teste
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Confirmar saida
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: FitLauncherPX5-v0.6-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
